name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: --timeout=5m
          only-new-issues: true

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23', '1.24']
    env:
      BUILD_TYPE: development
      VALIDATION: basic
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Determine validation level and build type
        run: |
          # Default
          echo "BUILD_TYPE=development" >> $GITHUB_ENV
          echo "VALIDATION=basic" >> $GITHUB_ENV

          # PRs to main => extended
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ github.base_ref }}" == "main" ]]; then
            echo "BUILD_TYPE=staging" >> $GITHUB_ENV
            echo "VALIDATION=extended" >> $GITHUB_ENV
          fi

          # main branch => release
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "BUILD_TYPE=release" >> $GITHUB_ENV
            echo "VALIDATION=release" >> $GITHUB_ENV
          fi

          echo "Resolved BUILD_TYPE=$BUILD_TYPE, VALIDATION=$VALIDATION"

      - name: Build binary
        run: |
          # Set build tags based on build type
          BUILD_TAGS="development"
          if [ "$BUILD_TYPE" = "staging" ]; then
            BUILD_TAGS="staging"
          elif [ "$BUILD_TYPE" = "release" ]; then
            BUILD_TAGS="release,production"
          fi

          # Build with appropriate tags and version info
          go build -v -tags="${BUILD_TAGS}" -o api \
            -ldflags="-X main.version=${{ matrix.go-version }} \
                      -X main.commit=${GITHUB_SHA::8} \
                      -X main.date=$(date -u +'%Y-%m-%d') \
                      -X main.buildType=$BUILD_TYPE" \
            ./cmd/api

      - name: Verify binary
        run: |
          # Common checks
          if [ ! -x ./api ]; then
            echo "Error: Binary is not executable"
            exit 1
          fi

          # Run version check
          output=$(TEST_MODE=true ./api -v)
          exit_code=$?
          if [ $exit_code -ne 0 ]; then
            echo "Error: Binary returned non-zero exit code: $exit_code"
            exit 1
          fi

          # Verify version format
          if ! echo "$output" | grep -qE "Finance App API [0-9]+\.[0-9]+ \([a-f0-9]+\) built on [0-9]{4}-[0-9]{2}-[0-9]{2}"; then
            echo "Error: Invalid version output format"
            echo "Got: $output"
            exit 1
          fi

          # Validation level-specific checks
          case "$VALIDATION" in
            "release")
              echo "🔍 Performing release validation..."
              # Run comprehensive tests
              go test -v -tags=release ./...
              # Verify all required assets are present
              if [ ! -f "./api" ]; then
                echo "Error: Release binary missing"
                exit 1
              fi
              # Check binary size
              size=$(stat -f%z ./api 2>/dev/null || stat -c%s ./api)
              if [ "$size" -lt 1000000 ]; then
                echo "Error: Binary size suspiciously small"
                exit 1
              fi
              ;;

            "extended")
              echo "🔍 Performing extended validation..."
              # Run integration tests
              go test -v -tags=integration ./...
              ;;

            "basic")
              echo "✓ Basic validation successful"
              ;;
          esac

          echo "🎉 Binary verification successful ($VALIDATION level)"
          echo "📦 Build type: $BUILD_TYPE"
          echo "🔖 Version info: $output"

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: suma_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Run tests
        run: |
          go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: suma_test
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 5" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below minimum threshold of 5%"
            exit 1
          fi
          if (( $(echo "$COVERAGE < 30" | bc -l) )); then
            echo "Coverage ${COVERAGE}% is below recommended threshold of 30%"
          fi
          echo "Coverage ${COVERAGE}% meets minimum threshold"
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.txt
          fail_ci_if_error: false
          flags: backend

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Install security tools
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run Gosec Security Scanner
        run: |
          gosec -exclude=G404 -exclude-dir=internal/mocks -fmt=json -out=gosec-report.json -no-fail ./...
          gosec -exclude=G404 -exclude-dir=internal/mocks ./...
      - name: Run Go Vulnerability Check
        run: |
          govulncheck ./...
      - name: Run Static Check
        run: |
          staticcheck ./...
      - name: Upload Gosec report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gosec-report
          path: gosec-report.json

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [lint, build, test, security]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.build.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"