# Version of the config format
version: 2

# This field used to be called 'run.deadline' in old versions
run:
  # NOTE: this used to be called 'deadline' in old versions
  timeout: 5m
  tests: true
  skip-dirs:
    - vendor/
    - node_modules/

linters:
  # Disable all linters except those explicitly enabled
  disable-all: true
  enable:
    - errcheck  # check for unchecked errors
    - govet    # go vet (examines Go source code and reports suspicious constructs)
    - staticcheck  # checks for common mistakes and suggests improvements
    - ineffassign  # detects ineffectual assignments
    - unused       # checks for unused constants, variables, functions and types

issues:
  # Exclude certain issues for test files
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck  # don't check for unchecked errors in tests
