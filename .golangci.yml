# golangci-lint configuration file
# See: https://golangci-lint.run/usage/configuration/

run:
  # timeout for analysis, e.g. 30s, 5m, default is 1m
  timeout: 5m
  # include test files or not, default is true
  tests: true
  # default concurrency is a available CPU number
  concurrency: 4
  # allow multiple parallel golangci-lint instances running
  allow-parallel-runners: false

linters:
  # Enable specific linters
  enable:
    # Default linters:
    - errcheck     # Detect unchecked errors
    - gosimple    # Simplify code
    - govet       # Report suspicious constructs
    - ineffassign # Detect ineffective assignments
    - staticcheck # Go static analysis
    - typecheck   # Go type analysis
    - unused      # Detect unused constants, variables, functions and types
    # Style linters:
    - gofmt       # Check if code was gofmt-ed
    - goimports   # Check imports formatting
    - revive      # Fast, configurable, extensible, flexible, and beautiful linter
    - misspell    # Fix spelling errors
    # Bug prevention:
    - errorlint   # Find error handling mistakes
    - gosec      # Security issues
    - nilerr     # Check returned nil error values
    # Performance:
    - prealloc   # Find slice declarations that could potentially be preallocated

linters-settings:
  gofmt:
    # simplify code: gofmt with `-s` option, true by default
    simplify: true
  revive:
    ignore-generated-header: true
    rules:
      - name: exported
        arguments: ["checkPrivateReceivers"]
      - name: dot-imports
        disabled: true
  errorlint:
    # Check whether fmt.Errorf uses the %w verb for formatting errors
    errorf: true
  gosec:
    excludes:
      - G404  # Insecure random number source (rand)

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck    # Ignore unchecked errors in tests
        - gosec      # Ignore security issues in tests
  # Maximum issues count per one linter
  max-issues-per-linter: 50
  # Maximum count of issues with the same text
  max-same-issues: 3

output:
  # colored-line-number|line-number|json|tab|checkstyle|code-climate|junit-xml|github-actions
  formats:
    - format: colored-line-number
  # print lines of code with issue, default is true
  print-issued-lines: true
  # print linter name in the end of issue text, default is true
  print-linter-name: true
