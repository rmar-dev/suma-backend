linters:
  enable:
    - gofmt
    - golint
    - govet
    - gosec
    - gosimple
    - staticcheck
    - typecheck
    - unused
    - misspell
    - unconvert
    - whitespace

run:
  deadline: 5m
  tests: true
  skip-dirs:
    - vendor/
    - node_modules/

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - errcheck

linters-settings:
  govet:
    check-shadowing: true
  golint:
    min-confidence: 0.8
  gofmt:
    simplify: true
  goconst:
    min-len: 3
    min-occurrences: 3

output:
  format: colored-line-number
  print-issued-lines: true
  print-linter-name: true